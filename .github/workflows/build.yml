          package jp.kawaguchi.gomitsuji

          import java.time.DayOfWeek
          import java.time.LocalDate
          import java.time.LocalDateTime
          import java.time.LocalTime

          /**
           * 川口市 家庭ごみ収集日カレンダー 番号7（辻）
           * https://kawaguchi-gomimaru.jp/calendar/76/
           *
           * 一般ごみ・有害ごみ : 毎週 火・金
           * プラスチック       : 毎週 水
           * びん・かん         : 第1・第3 木
           * ペットボトル・繊維 : 第2・第4 木
           * 金属・紙           : 第2・第4 金
           */
          object GarbageSchedule {

              /** 通知する時刻（収集日の前日） */
              val NOTIFY_TIME: LocalTime = LocalTime.of(21, 0)

              /**
               * 収集が休みになる日（年末年始など）。
               * 市のカレンダーで休みと分かった日を "2027-01-01" の形で追加してください。
               */
              private val HOLIDAYS: Set<LocalDate> = setOf<String>(
                  // "2026-12-31",
                  // "2027-01-01",
              ).map { LocalDate.parse(it) }.toSet()

              /** その日に出せる品目 */
              fun itemsFor(date: LocalDate): List<String> {
                  if (date in HOLIDAYS) return emptyList()
                  val nth = (date.dayOfMonth - 1) / 7 + 1 // 第何週の曜日か
                  val items = mutableListOf<String>()
                  when (date.dayOfWeek) {
                      DayOfWeek.TUESDAY -> items += listOf("一般ごみ", "有害ごみ")
                      DayOfWeek.WEDNESDAY -> items += "プラスチック"
                      DayOfWeek.THURSDAY -> when (nth) {
                          1, 3 -> items += listOf("びん", "かん")
                          2, 4 -> items += listOf("ペットボトル", "繊維")
                      }
                      DayOfWeek.FRIDAY -> {
                          items += listOf("一般ごみ", "有害ごみ")
                          if (nth == 2 || nth == 4) items += listOf("金属", "紙")
                      }
                      else -> {}
                  }
                  return items
              }

              fun message(items: List<String>): String =
                  "明日は${items.joinToString("・")}のゴミ出しの日です"

              data class Next(val notifyAt: LocalDateTime, val collectionDate: LocalDate, val items: List<String>)

              /** now より後で、次に通知すべきタイミング */
              fun next(now: LocalDateTime): Next? {
                  var day = now.toLocalDate()
                  repeat(400) {
                      val notifyAt = day.atTime(NOTIFY_TIME)
                      val collection = day.plusDays(1)
                      val items = itemsFor(collection)
                      if (notifyAt.isAfter(now) && items.isNotEmpty()) {
                          return Next(notifyAt, collection, items)
                      }
                      day = day.plusDays(1)
                  }
                  return null
              }
          }
          GOMI_EOF
