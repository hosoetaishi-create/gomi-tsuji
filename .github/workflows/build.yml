          package jp.kawaguchi.gomitsuji

          import android.Manifest
          import android.app.AlarmManager
          import android.app.NotificationChannel
          import android.app.NotificationManager
          import android.app.PendingIntent
          import android.content.Context
          import android.content.Intent
          import android.content.pm.PackageManager
          import android.os.Build
          import java.time.LocalDateTime
          import java.time.ZoneId

          object Notifier {
              private const val CHANNEL_ID = "gomi"
              private const val NOTIFICATION_ID = 1
              const val EXTRA_MESSAGE = "message"

              fun ensureChannel(context: Context) {
                  val nm = context.getSystemService(NotificationManager::class.java)
                  if (nm.getNotificationChannel(CHANNEL_ID) == null) {
                      val ch = NotificationChannel(CHANNEL_ID, "ゴミ出しのお知らせ", NotificationManager.IMPORTANCE_HIGH)
                      ch.description = "収集日の前日21時にお知らせします"
                      nm.createNotificationChannel(ch)
                  }
              }

              fun show(context: Context, message: String) {
                  if (Build.VERSION.SDK_INT >= 33 &&
                      context.checkSelfPermission(Manifest.permission.POST_NOTIFICATIONS) != PackageManager.PERMISSION_GRANTED
                  ) return
                  ensureChannel(context)
                  val open = PendingIntent.getActivity(
                      context, 0, Intent(context, MainActivity::class.java),
                      PendingIntent.FLAG_IMMUTABLE or PendingIntent.FLAG_UPDATE_CURRENT
                  )
                  val n = android.app.Notification.Builder(context, CHANNEL_ID)
                      .setSmallIcon(R.drawable.ic_notify)
                      .setContentTitle("ゴミ出しのお知らせ")
                      .setContentText(message)
                      .setStyle(android.app.Notification.BigTextStyle().bigText(message))
                      .setContentIntent(open)
                      .setAutoCancel(true)
                      .build()
                  context.getSystemService(NotificationManager::class.java).notify(NOTIFICATION_ID, n)
              }

              /** 次の通知をセットし、その内容を返す */
              fun scheduleNext(context: Context): GarbageSchedule.Next? {
                  val next = GarbageSchedule.next(LocalDateTime.now()) ?: return null
                  val am = context.getSystemService(AlarmManager::class.java)
                  val intent = Intent(context, AlarmReceiver::class.java)
                      .putExtra(EXTRA_MESSAGE, GarbageSchedule.message(next.items))
                  val pi = PendingIntent.getBroadcast(
                      context, 0, intent,
                      PendingIntent.FLAG_IMMUTABLE or PendingIntent.FLAG_UPDATE_CURRENT
                  )
                  val triggerMillis = next.notifyAt.atZone(ZoneId.systemDefault()).toInstant().toEpochMilli()
                  if (canExact(context)) {
                      am.setExactAndAllowWhileIdle(AlarmManager.RTC_WAKEUP, triggerMillis, pi)
                  } else {
                      // 正確なアラームが許可されていない場合（数分ずれることがあります）
                      am.setAndAllowWhileIdle(AlarmManager.RTC_WAKEUP, triggerMillis, pi)
                  }
                  return next
              }

              fun canExact(context: Context): Boolean =
                  Build.VERSION.SDK_INT < 31 || context.getSystemService(AlarmManager::class.java).canScheduleExactAlarms()
          }
          GOMI_EOF
          mkdir -p app/src/main/java/jp/kawaguchi/gomitsuji
